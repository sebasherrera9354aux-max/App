name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mv app/build/outputs/apk/release/app-release.apk PanelOperario.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PanelOperario-APK
          path: PanelOperario.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Panel Operario ${{ github.run_number }}
          files: PanelOperario.apk
