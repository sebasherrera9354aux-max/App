plugins {
    id 'com.android.application'
}

android {
    namespace 'com.grandbay.paneloperario'
    compileSdk 35

    defaultConfig {
        applicationId 'com.grandbay.paneloperario'
        minSdk 21
        targetSdk 35
        versionCode 10
        versionName '2.6'
    }

    // Llave fija: todas las versiones se firman igual y se instalan encima de la anterior
    signingConfigs {
        fija {
            storeFile file('paneloperario.jks')
            storePassword 'grandbay2026'
            keyAlias 'paneloperario'
            keyPassword 'grandbay2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fija
        }
        debug {
            signingConfig signingConfigs.fija
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
