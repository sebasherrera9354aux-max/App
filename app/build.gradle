plugins {
    id 'com.android.application'
}

android {
    namespace 'com.grandbay.paneloperario'
    compileSdk 35

    defaultConfig {
        applicationId 'com.grandbay.paneloperario'
        minSdk 21
        targetSdk 35
        versionCode 6
        versionName '2.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // para que el APK release también se pueda instalar
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
